# Airport Tycoon — runtime & gameplay configuration
# ===================================================
# This file is read by the SLeeLa runtime (memory_* / system_monitor keys,
# mirroring SLeeLa's sleela.conf.example) and by the game itself (the
# gameplay.* keys). The ".sleela" Wrapper exposes the matching static fields so
# a developer can retune difficulty without editing code.

# --- SLeeLa VM (see SLeeLa sleela.conf.example; range 256M..2G) ---
memory_limit=512M
memory_manager=on
memory_manager_grade=1
system_monitor=on
system_monitor_strict=off

# --- Gameplay tuning (maps to AirportTycoon.sleela static fields) ---
# Starting economy
gameplay.start_cash=2000
gameplay.start_reputation=100

# Capacity (hard caps; must respect the struct instance budget)
gameplay.max_gates=8
gameplay.max_runways=3
gameplay.start_open_gates=2
gameplay.start_open_runways=1

# Pace: planes arrive every N ticks; the gap shrinks to the floor as the
# shift goes on, which is what makes the game progressively faster.
gameplay.spawn_every=20
gameplay.spawn_floor=6

# Determinism: the PRNG seed. Same seed => identical shift (for replay/tests).
gameplay.rng_seed=123457

# Penalty when a plane runs out of patience and leaves.
gameplay.abandon_reputation_cost=12

# --- Edition 2: economic feedback loop -------------------------------------
# Fares are scaled by a reputation-driven "service premium" (percent). The
# premium is 100% (neutral) at premium_ref_rep and moves one-for-one with
# reputation, clamped to [premium_min_pct, premium_max_pct]. Maps to the
# matching PREMIUM_* static fields in AirportTycoon.sleela.
gameplay.premium_ref_rep=60
gameplay.premium_min_pct=70
gameplay.premium_max_pct=150

# On-time combo: every combo_step consecutive on-time departures pays a flat
# combo_tip in cash; a single abandonment resets the streak to zero.
gameplay.combo_step=5
gameplay.combo_tip=150

# --- Edition 2: the Business Desk (side ventures + Level-5 moves) -----------
# The desk starts empty; the player tries on side games (Casino Management and
# Investment Management, modelled as Chemistry reactions) that settle a weekly
# transaction. A venture accrues IQ from profitable weeks; at desk_major_level
# it fires the "Great Assimilation" — assim_east_pct% Major-Eastern revenue for
# assim_weeks weeks (the stretch that rakes in the money). Maps to the matching
# static fields in game/BusinessDesk.sleela.
gameplay.desk_major_level=5
gameplay.desk_iq_per_level=1
gameplay.desk_assim_weeks=6
gameplay.desk_assim_east_pct=300
gameplay.desk_seed=90210

# --- Edition 3: Platinum Ascension / Prosperity Contracts ------------------
# One active contract gives the tower a strategic aircraft-size target.
gameplay.contract_goal=5
gameplay.contract_deadline=240
gameplay.contract_bonus=500
gameplay.contract_reputation_bonus=2
