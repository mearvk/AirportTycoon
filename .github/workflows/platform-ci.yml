name: Airport Tycoon Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.os }} — Editions 1-8
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test every JavaFX edition
        shell: python
        run: |
          import pathlib, subprocess
          root = pathlib.Path.cwd()
          for edition in range(1, 9):
              ui = root / str(edition) / 'ui'
              print(f'== Edition {edition} ==')
              subprocess.run(['mvn', '-q', '-DskipTests=false', 'test'], cwd=ui, check=True)
      - name: Prepare standard build directories
        shell: python
        run: |
          import pathlib
          root = pathlib.Path.cwd()
          for edition in range(1, 9):
              (root / 'build' / str(edition)).mkdir(parents=True, exist_ok=True)
          (root / 'build' / 'dungeons-of-moria').mkdir(parents=True, exist_ok=True)
      - name: Verify build tree
        shell: python
        run: |
          import pathlib
          root = pathlib.Path.cwd()
          expected = [root / 'build' / str(i) for i in range(1, 9)] + [root / 'build' / 'dungeons-of-moria']
          missing = [str(p) for p in expected if not p.is_dir()]
          if missing: raise SystemExit('Missing build directories: ' + ', '.join(missing))
