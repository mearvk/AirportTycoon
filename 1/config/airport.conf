# Airport Tycoon — runtime & gameplay configuration
# ===================================================
# This file is read by the SLeeLa runtime (memory_* / system_monitor keys,
# mirroring SLeeLa's sleela.conf.example) and by the game itself (the
# gameplay.* keys). The ".sleela" Wrapper exposes the matching static fields so
# a developer can retune difficulty without editing code.

# --- SLeeLa VM (see SLeeLa sleela.conf.example; range 256M..2G) ---
memory_limit=512M
memory_manager=on
memory_manager_grade=1
system_monitor=on
system_monitor_strict=off

# --- Gameplay tuning (maps to AirportTycoon.sleela static fields) ---
# Starting economy
gameplay.start_cash=2000
gameplay.start_reputation=100

# Capacity (hard caps; must respect the struct instance budget)
gameplay.max_gates=8
gameplay.max_runways=3
gameplay.start_open_gates=2
gameplay.start_open_runways=1

# Pace: planes arrive every N ticks; the gap shrinks to the floor as the
# shift goes on, which is what makes the game progressively faster.
gameplay.spawn_every=20
gameplay.spawn_floor=6

# Determinism: the PRNG seed. Same seed => identical shift (for replay/tests).
gameplay.rng_seed=123457

# Penalty when a plane runs out of patience and leaves.
gameplay.abandon_reputation_cost=12
