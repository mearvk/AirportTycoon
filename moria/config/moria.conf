# Moria — settings
# ================
# Tuning knobs for the Mines. The authoritative defaults are the matching
# `static` fields in the .sleela Wrappers; this file documents them in one
# place (the "settings somewhere" the weapon rules assume).

# --- Weapons: the mutual plus -----------------------------------------------
# "+1 to hit or damage is MUTUAL": the +N enchantment adds to BOTH the attack
# roll and the damage. Maps to MoriaWeapons.MUTUAL_PLUS (1 = mutual, 0 = damage
# only). Assumed on.
weapons.mutual_plus=1

# --- The Mace of the Deep ---------------------------------------------------
# The signature mace: average 1d48 + 26 hit points (avg ~50 before STR/enchant).
# Maps to MoriaWeapons.MACE_DIE / MACE_FLAT.
weapons.mace_die=48
weapons.mace_flat=26

# --- The enchantment incurrence-radius / depth model ------------------------
# A +N weapon carries an "incurrence radius" of extra-damage potential:
#
#   radiusBase(bonus)      = 2^(bonus + radius_base_shift)   -> +5 => 256
#   depthMultiplier(depth) = radius_ref_depth / depth, clamped >= 1
#   radiusLevels           = radiusBase * depthMultiplier
#   extraPotential         = radiusLevels * extra_per_radius
#
# ANCHOR (by decree): a +5 weapon at Dungeon Depth 16 has ~256 radius levels,
# i.e. ~1024 extra potential damage. Falloff is geometric: +4 => 128, +3 => 64,
# +2 => 32, +1 => 16, +0 => 8 (at depth 16). LOWER depths are MORE GENEROUS:
# a +5 is radius 256 at depth 16, 512 at depth 8, 1024 at depth 4, 4096 at
# depth 1. Maps to MoriaWeapons.RADIUS_* and EXTRA_PER_RADIUS.
weapons.radius_ref_depth=16
weapons.radius_base_shift=3
weapons.extra_per_radius=4
